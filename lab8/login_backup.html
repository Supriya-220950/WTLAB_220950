<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCare Login</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #1e3a8a 0%, #3baea0 100%); height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 400px; text-align: center; }
        .form-control { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: #3baea0; color: white; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-bottom: 15px; }
        .btn:hover { background: #2f8f9d; }
        .oauth-btn { background: white; border: 1px solid #ccc; color: #333; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; }
        .oauth-btn img { width: 20px; }
        .error { color: red; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 style="color: #1e3a8a; margin-bottom: 20px;">SmartCare Gateway</h2>
                <form method="POST">
            <input type="email" name="email" class="form-control" required placeholder="doctor@smartcare.com">
            <input type="password" name="password" class="form-control" required placeholder="password123">
            <button type="submit" class="btn">Secure Login</button>
        </form>
        <div style="margin: 15px 0; color: #888;">OR</div>
        <a href="dashboard.php?oauth=google" class="btn oauth-btn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google">
            Sign in with Google
        </a>
    </div>
</body>
</html>
