<!DOCTYPE html>
<html>
<head>
<title>Traversing</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>

<div id="parent">
    Parent
    <p id="child">Child</p>
</div>

<button id="parentBtn">Parent</button>
<button id="childBtn">Children</button>
<button id="sibBtn">Siblings</button>

<script>
$("#parentBtn").click(()=> $("#child").parent().css("color","red"));
$("#childBtn").click(()=> $("#parent").children().css("background","yellow"));
$("#sibBtn").click(()=> $("#child").siblings().css("border","2px solid blue"));
</script>

</body>
</html>
