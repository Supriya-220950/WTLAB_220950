<head>
    <title>jQuery Lab Dashboard</title>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <link rel="stylesheet" href="style.css">

<script src="script.js" defer></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 40px;
            font-size: 40px;
        }

        p {
            font-size: 18px;
            margin-bottom: 40px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            padding: 20px 50px;
        }

        .card {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 15px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-10px);
            background: #f0f0f0;
        }

        .footer {
            margin-top: 40px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <h1>🚀 jQuery Lab Dashboard</h1>
    <p>Select a topic to explore</p>

    <div class="container">
        <a href="selectors.html" class="card">Selectors</a>
        <a href="attributes.html" class="card">Attributes</a>
        <a href="events.html" class="card">Events</a>
        <a href="style.html" class="card">Style</a>
        <a href="traversing.html" class="card">Traversing</a>
        <a href="effects.html" class="card">Effects</a>
    </div>

    <div class="footer">
        © 2026 jQuery Lab | Designed by Supriya Akula
    </div>

    <script>
        $(document).ready(function(){
            $(".card").hover(function(){
                $(this).css("background", "#e3e3ff");
            }, function(){
                $(this).css("background", "white");
            });
        });
    </script>

</body>
</html>
